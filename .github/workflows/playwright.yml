
name: Playwright CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Pylint Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylint

      - name: Run Pylint
        continue-on-error: true
        run: |
          python -m pylint \
            config/ \
            data/ \
            fixtures/ \
            pages/ \
            tests/ \
            utils/ \
            conftest.py \
            --output-format=github

  security:
    name: Python Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit Python dependencies
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt

  tests:
    name: Playwright Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          BASE_URL: ${{ secrets.TEST_BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          python -m pytest \
            --env=dev \
            --browser ${{ matrix.browser }} \
            -v -n 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            reports/allure-results/
            reports/junit/
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Allure Consolidated Report
    needs: tests
    if: ${{ always() && needs.tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download browser results
        uses: actions/download-artifact@v5
        with:
          pattern: playwright-results-*
          path: reports/browser-results

      - name: Publish JUnit test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Playwright Cross-Browser Results
          path: reports/browser-results/**/junit/*.xml
          reporter: python-xunit
          use-actions-summary: "true"
          list-suites: failed
          list-tests: failed
          fail-on-error: "false"
          fail-on-empty: "true"

      - name: Set up Python for report consolidation
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Merge Allure results
        run: |
          python -m utils.allure_metadata \
            reports/browser-results \
            reports/merged-allure-results

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Allure Commandline
        run: npm install -g allure-commandline@2.46.1

      - name: Generate consolidated report
        run: |
          allure generate \
            reports/merged-allure-results \
            --clean \
            -o reports/allure-report

      - name: Upload consolidated report
        uses: actions/upload-artifact@v5
        with:
          name: allure-consolidated-report
          path: reports/allure-report/
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
