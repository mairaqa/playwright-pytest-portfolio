
name: Playwright CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Pylint Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylint

      - name: Run Pylint
        continue-on-error: true
        run: |
          python -m pylint \
            config/ \
            data/ \
            fixtures/ \
            pages/ \
            tests/ \
            utils/ \
            conftest.py \
            --output-format=github

  security:
    name: Python Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit Python dependencies
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt

  tests:
    name: Playwright Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Allure Commandline
        run: npm install -g allure-commandline@2.46.1

      - name: Run tests
        env:
          BASE_URL: ${{ secrets.TEST_BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          python -m pytest \
            --env=dev \
            --browser ${{ matrix.browser }} \
            -v -n 0

      - name: Generate Allure HTML report
        if: success() || failure()
        run: |
          if [ -d reports/allure-results ] && \
             [ -n "$(ls -A reports/allure-results)" ]; then
            allure generate \
              reports/allure-results \
              --clean \
              -o reports/allure-report
          else
            echo "No Allure results available"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            reports/junit/
            reports/allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-html-${{ matrix.browser }}
          path: reports/allure-report/
          if-no-files-found: warn
          retention-days: 7
